<!doctype html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c25"><title>Qari Osama</title><link rel="manifest" href="manifest.json">
<style>@font-face{
  font-family:'UthmanicHafs';
  src:url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2') format('woff2');
  font-display:swap;
}
:root{--gold:#d9b66d;--text:#f7f3e9;--muted:#b8c8be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c4638,#081914 55%);color:var(--text);font-family:system-ui,sans-serif}header{text-align:center;padding:24px;border-bottom:1px solid #ffffff20}.logo{font-size:32px;color:var(--gold)}h1{font: bold 30px Georgia;color:var(--gold);margin:4px}.muted{color:var(--muted);font-size:12px}main{max-width:760px;margin:auto;padding:16px 14px 115px}h2{font-size:18px}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff10;color:white;font-size:16px}.list{display:grid;gap:8px;margin-top:12px}.surah{display:flex;gap:12px;align-items:center;padding:13px;border-radius:14px;border:1px solid #ffffff20;background:#15392f;color:white;text-align:left}.num{color:var(--gold);font-weight:bold}.info{flex:1}.arabic{color:var(--gold);font-size:20px}.reader{display:none}.back,.play{background:#d9b66d18;color:var(--gold);border:1px solid #d9b66d88;border-radius:10px;padding:9px}.readerhead{text-align:center;background:#102c25;padding:15px;border-radius:14px;margin:12px 0}.readerhead h2{color:var(--gold);font:26px Georgia}.ayah{background:#15392f;border:1px solid #ffffff20;border-radius:14px;padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;color:var(--gold);font-size:12px}.arabictext{direction:rtl;text-align:right;font-family:serif;font-size:27px;line-height:2;margin:12px 0}.translation{font-size:14px;line-height:1.7;margin-top:9px}.translation b{display:block;color:var(--gold);font-size:11px}.player{position:fixed;bottom:0;left:0;right:0;background:#0d241ef2;padding:10px 14px;border-top:1px solid #ffffff30}.player audio{width:100%}.now{color:var(--gold);font-size:12px;margin-bottom:4px}.notice{font-size:11px;color:var(--muted);line-height:1.5}.loading{text-align:center;padding:20px;color:var(--muted)}
</style></head><body><header><div class="logo">۞</div><h1>Qari Osama</h1><div class="muted">القرآن الكريم • Qur’aanka Kariimka ah</div></header><main>
<section id="home"><h2>Suuradaha Qur’aanka</h2><input id="search" class="search" placeholder="Raadi suurad..."><div id="list" class="list"><div class="loading">Suuradaha waa la diyaarinayaa…</div></div><p class="notice">Aayad kasta waxaa la socda Carabi, Soomaali iyo English. Tarjumaadaha: QuranEnc.com.</p></section>
<section id="reader" class="reader"><button id="back" class="back">← Ku noqo suuradaha</button><div class="readerhead"><h2 id="arname"></h2><div id="soname" class="muted"></div></div><div id="ayahs"><div class="loading">Aayadaha waa la soo dejinayaa…</div></div></section></main>
<div class="player"><div id="now" class="now">Qari Osama • Dooro suurad</div><audio id="audio" controls preload="none"></audio></div>
<script>
const S=[["Al-Faatixa","الفاتحة",7],["Al-Baqara","البقرة",286],["Aal-Cimraan","آل عمران",200],["An-Nisaa","النساء",176],["Al-Maa'ida","المائدة",120],["Al-Ancaam","الأنعام",165],["Al-Acraaf","الأعراف",206],["Al-Anfaal","الأنفال",75],["At-Tawba","التوبة",129],["Yuunus","يونس",109],["Huud","هود",123],["Yuusuf","يوسف",111],["Ar-Racdi","الرعد",43],["Ibraahiim","إبراهيم",52],["Al-Xijr","الحجر",99],["An-Naxli","النحل",128],["Al-Israa","الإسراء",111],["Al-Kahf","الكهف",110],["Maryam","مريم",98],["Daahaa","طه",135],["Al-Anbiyaa","الأنبياء",112],["Al-Xajj","الحج",78],["Al-Mu'minuun","المؤمنون",118],["An-Nuur","النور",64],["Al-Furqaan","الفرقان",77],["Ash-Shucaraa","الشعراء",227],["An-Naml","النمل",93],["Al-Qasas","القصص",88],["Al-Cankabuut","العنكبوت",69],["Ar-Ruum","الروم",60],["Luqmaan","لقمان",34],["As-Sajda","السجدة",30],["Al-Axzaab","الأحزاب",73],["Saba","سبأ",54],["Faatir","فاطر",45],["Yaa-Siin","يس",83],["As-Saaffaat","الصافات",182],["Saad","ص",88],["Az-Zumar","الزمر",75],["Ghaafir","غافر",85],["Fussilat","فصلت",54],["Ash-Shuuraa","الشورى",53],["Az-Zukhruf","الزخرف",89],["Ad-Dukhaan","الدخان",59],["Al-Jaathiya","الجاثية",37],["Al-Axqaaf","الأحقاف",35],["Muxammad","محمد",38],["Al-Fatx","الفتح",29],["Al-Xujuraat","الحجرات",18],["Qaaf","ق",45],["Adh-Dhaariyaat","الذاريات",60],["At-Tuur","الطور",49],["An-Najm","النجم",62],["Al-Qamar","القمر",55],["Ar-Raxmaan","الرحمن",78],["Al-Waaqica","الواقعة",96],["Al-Xadiid","الحديد",29],["Al-Mujaadila","المجادلة",22],["Al-Xashr","الحشر",24],["Al-Mumt taxina","الممتحنة",13],["As-Saff","الصف",14],["Al-Jumuca","الجمعة",11],["Al-Munaafiquun","المنافقون",11],["At-Taghaabun","التغابن",18],["At-Talaaq","الطلاق",12],["At-Taxriim","التحريم",12],["Al-Mulk","الملك",30],["Al-Qalam","القلم",52],["Al-Xaaqqa","الحاقة",52],["Al-Macaarij","المعارج",44],["Nuux","نوح",28],["Al-Jinn","الجن",28],["Al-Muzzammil","المزمل",20],["Al-Muddaththir","المدثر",56],["Al-Qiyaama","القيامة",40],["Al-Insaan","الإنسان",31],["Al-Mursalaat","المرسلات",50],["An-Naba","النبأ",40],["An-Naazicaat","النازعات",46],["C Abasa","عبس",42],["At-Takwiir","التكوير",29],["Al-Infitaar","الإنفطار",19],["Al-Mutaffifiin","المطففين",36],["Al-Inshiqaaq","الإنشقاق",25],["Al-Buruuj","البروج",22],["At-Taariq","الطارق",17],["Al-Aclaa","الأعلى",19],["Al-Ghaashiya","الغاشية",26],["Al-Fajr","الفجر",30],["Al-Balad","البلد",20],["Ash-Shams","الشمس",15],["Al-Layl","الليل",21],["Ad-Duxaa","الضحى",11],["Ash-Sharx","الشرح",8],["At-Tiin","التين",8],["Al-Calaq","العلق",19],["Al-Qadr","القدر",5],["Al-Bayyina","البينة",8],["Az-Zalzala","الزلزلة",8],["Al-Caadiyaat","العاديات",11],["Al-Qaari'a","القارعة",11],["At-Takaathur","التكاثر",8],["Al-Casr","العصر",3],["Al-Humaza","الهمزة",9],["Al-Fiil","الفيل",5],["Quraysh","قريش",4],["Al-Maacuun","الماعون",7],["Al-Kawthar","الكوثر",3],["Al-Kaafiruuna","الكافرون",6],["An-Nasr","النصر",3],["Al-Masad","المسد",5],["Al-Ikhlaas","الإخلاص",4],["Al-Falaq","الفلق",5],["An-Naas","الناس",6]];
const $=x=>document.getElementById(x), audio=$("audio");
function showList(q=""){$("list").innerHTML="";S.forEach((s,i)=>{if(!s[0].toLowerCase().includes(q.toLowerCase())&&!s[1].includes(q))return;let b=document.createElement("button");b.className="surah";b.innerHTML=`<span class="num">${i+1}</span><span class="info">${s[0]}<div class="muted">${s[2]} aayadood</div></span><span class="arabic">${s[1]}</span>`;b.onclick=()=>openSura(i+1);$("list").append(b)})}
$("search").oninput=e=>showList(e.target.value);$("back").onclick=()=>{$("reader").style.display="none";$("home").style.display="block";audio.pause()};
async function fetchS(key,n){let r=await fetch(`https://quranenc.com/api/v1/translation/sura/${key}/${n}`);if(!r.ok)throw Error(key+" translation unavailable");let j=await r.json();return j.result||[]}
async function openSura(n){$("home").style.display="none";$("reader").style.display="block";$("arname").textContent=S[n-1][1];$("soname").textContent=S[n-1][0];$("ayahs").innerHTML='<div class="loading">Aayadaha iyo tarjumaadaha waa la soo dejinayaa…</div>';try{let [so,en]=await Promise.all([fetchS("somali_yacob",n),fetchS("english_saheeh",n)]);let em=new Map(en.map(x=>[+x.aya,x.translation]));$("ayahs").innerHTML="";so.forEach(x=>{let d=document.createElement("article");d.className="ayah";let top=document.createElement("div");top.className="top";top.innerHTML=`<span>Aayadda ${x.aya}</span><button class="play">▶ Dhageyso</button>`;top.querySelector("button").onclick=()=>{$("now").textContent=`Suuradda ${S[n-1][0]} • Aayadda ${x.aya}`;let sn=String(n).padStart(3,"0"),an=String(x.aya).padStart(3,"0");audio.src=`https://d.quranenc.com/data/audio/somali_yacob/${sn}${an}.mp3`;audio.play().catch(()=>{})};let ar=document.createElement("div");ar.className="arabictext";ar.textContent=x.arabic_text||"";let soD=document.createElement("div");soD.className="translation";soD.innerHTML="<b>SOOMAALI</b>";soD.append(document.createTextNode(x.translation||""));let enD=document.createElement("div");enD.className="translation";enD.innerHTML="<b>ENGLISH</b>";enD.append(document.createTextNode(em.get(+x.aya)||""));d.append(top,ar,soD,enD);$("ayahs").append(d)})}catch(e){$("ayahs").innerHTML='<div class="loading">Tarjumaadaha lama soo dejin karin. Hubi internetka oo mar kale isku day.</div>'}}
showList();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

const oldOpenSura=openSura;

const fatihahMarks=[0,2.3,7.2,10.2,13.5,18.8,23.7];

const syncStyle=document.createElement("style");
syncStyle.textContent=".ayah.qari-current{border:2px solid #d9b66d;background:#294d3f;box-shadow:0 0 14px #d9b66d55;}";
document.head.append(syncStyle);



let lastAyah=-1;

function syncFatihaAyah(){
  if(!audio.src.includes("fatiha-qari-osama.mp.mp3"))return;

  const t=audio.currentTime;
  let i=-1;

  for(let j=0;j<7;j++){
    if(t>=fatihahMarks[j] &&
       (j===6 || t<fatihahMarks[j+1])){
      i=j;
      break;
    }
  }

  if(i===lastAyah)return;
  lastAyah=i;

  document.querySelectorAll("#ayahs .ayah").forEach((el,j)=>{
    el.classList.toggle("qari-current",j===i);
    if(j===i){
      el.scrollIntoView({behavior:"smooth",block:"center"});
    }
  });
}

audio.addEventListener("timeupdate",syncFatihaAyah);
audio.addEventListener("seeked",syncFatihaAyah);
audio.addEventListener("play",syncFatihaAyah);

openSura=async function(n){
  await oldOpenSura(n);

  if(n===1){
    lastAyah=-1;
    audio.pause();
    audio.src="fatiha-qari-osama.mp.mp3";
    audio.currentTime=0;
    audio.load();

    $("now").textContent="Qari Osama • Suuratul-Faatixah";

    audio.play().catch(error=>{
      console.log("Audio error:",error);
    });

  }else{
    audio.pause();
  }
};</script></body></html>
